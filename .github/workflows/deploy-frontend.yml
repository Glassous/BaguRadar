name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: 构建并部署前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # 必填：仓库 Settings → Secrets and variables → Actions → Secrets
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # 可选：known_hosts 固定指纹；不配置则用 ssh-keyscan 自动获取
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      # 可选：Settings → Secrets and variables → Actions → Variables
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/1panel/www/sites/baguradar/index/dist' }}
      VITE_BUCKET_BASE_URL: ${{ vars.VITE_BUCKET_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 构建全程在 GitHub 托管的 runner 上完成，服务器不参与构建
      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "产物大小：$(du -sh dist | cut -f1)，文件数：$(find dist -type f | wc -l)"

      - name: 校验部署变量
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "缺少必需的仓库 Secret：$missing"
            exit 1
          fi
          echo "部署目标：$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT$DEPLOY_PATH"

      - name: 准备 SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 确保目标目录存在
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      # 只上传 runner 上已构建好的静态文件，不在服务器安装依赖或执行构建
      - name: 同步构建产物
        run: |
          rsync -rlptz --delete-after --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
