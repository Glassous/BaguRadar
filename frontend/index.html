<!doctype html>
<html lang="zh-CN" class="">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="BaguRadar —— 计算机八股文知识库，覆盖计算机基础、语言运行时、后端中间件、前端、分布式、云原生与 AI 工程。"
    />
    <meta name="theme-color" content="#FBFBF9" />
    <meta name="application-name" content="BaguRadar" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BaguRadar · 计算机八股文知识库</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('baguradar-theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
          if (isDark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          // 同步窗口主题色：已安装 PWA 的标题栏控件区按该色绘制，必须与顶栏底色一致
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', isDark ? '#0b0f14' : '#fbfbf9')
        } catch (error) {
          console.error('[BaguRadar] 初始化主题失败', error)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
